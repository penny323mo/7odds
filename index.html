<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足球賠率篩選工具 ‧ 亞洲盤</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{padding-top:1.5rem}
.nav-tabs .nav-link{font-weight:600}
#chart-container{width:220px;margin:1rem auto}
table th,table td{white-space:nowrap}
</style>
</head>
<body>
<div class="container">
  <h2 class="text-center mb-4">足球賠率篩選工具</h2>

  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><a class="nav-link active" href="#">亞洲盤查詢</a></li>
    <li class="nav-item"><a class="nav-link disabled" href="#">大小球查詢</a></li>
    <li class="nav-item"><a class="nav-link disabled" href="#">歐洲盤查詢</a></li>
  </ul>

  <div class="text-right mb-2">版本時間：<span id="verTime"></span></div>

  <div class="form-group row">
    <label class="col-sm-2 col-form-label">博彩公司：</label>
    <div class="col-sm-4">
      <select id="companySel" class="form-control"></select>
    </div>
  </div>

  <!-- 初盤 -->
  <div class="border p-3 mb-3">
    <h5>初盤</h5>
    <div class="form-row">
      <div class="form-group col-md-2">
        <label>盤口</label>
        <select id="iHcapSel" class="form-control"></select>
      </div>
      <div class="form-group col-md-2">
        <label>主隊賠率&nbsp;Min</label>
        <input id="iHomeMin" type="number" step="0.01" class="form-control">
      </div>
      <div class="form-group col-md-2">
        <label>主隊賠率&nbsp;Max</label>
        <input id="iHomeMax" type="number" step="0.01" class="form-control">
      </div>
      <div class="form-group col-md-2">
        <label>客隊賠率&nbsp;Min</label>
        <input id="iAwayMin" type="number" step="0.01" class="form-control">
      </div>
      <div class="form-group col-md-2">
        <label>客隊賠率&nbsp;Max</label>
        <input id="iAwayMax" type="number" step="0.01" class="form-control">
      </div>
    </div>
  </div>

  <!-- 終盤 -->
  <div class="border p-3 mb-3">
    <h5>終盤</h5>
    <div class="form-row">
      <div class="form-group col-md-2">
        <label>盤口</label>
        <select id="fHcapSel" class="form-control"></select>
      </div>
      <div class="form-group col-md-2">
        <label>主隊賠率&nbsp;Min</label>
        <input id="fHomeMin" type="number" step="0.01" class="form-control">
      </div>
      <div class="form-group col-md-2">
        <label>主隊賠率&nbsp;Max</label>
        <input id="fHomeMax" type="number" step="0.01" class="form-control">
      </div>
      <div class="form-group col-md-2">
        <label>客隊賠率&nbsp;Min</label>
        <input id="fAwayMin" type="number" step="0.01" class="form-control">
      </div>
      <div class="form-group col-md-2">
        <label>客隊賠率&nbsp;Max</label>
        <input id="fAwayMax" type="number" step="0.01" class="form-control">
      </div>
    </div>
  </div>

  <div class="text-center mb-3">
    <button id="searchBtn" class="btn btn-primary">搜尋</button>
  </div>

  <!-- 統計 -->
  <div class="text-center mb-2">
    <span id="statWin">贏盤 0 (0%)</span> /
    <span id="statDraw">走水 0 (0%)</span> /
    <span id="statLose">輸盤 0 (0%)</span> 總 <span id="statTotal">0</span>
  </div>
  <div id="chart-container"><canvas id="pieChart"></canvas></div>

  <!-- 表格 -->
  <div class="table-responsive">
    <table class="table table-sm table-bordered" id="resTable">
      <thead class="thead-light">
        <tr>
          <th>日期</th><th>比賽</th>
          <th>初盤</th><th>初主</th><th>初客</th>
          <th>終盤</th><th>終主</th><th>終客</th>
          <th>結果</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.getElementById('verTime').textContent = new Date().toLocaleString('zh-HK',{hour12:false});

// <================ JSON 檔案映射 =================>
const fileMap = {
  Bet365:['Bet365_1.json','Bet365_2.json','Bet365_3.json','Bet365_4.json'],
  Crown:['Crown_1.json','Crown_2.json','Crown_3.json','Crown_4.json'],
  Interwetten:['Interwetten_1.json','Interwetten_2.json','Interwetten_3.json'],
  JC:['JC_1.json','JC_2.json','JC_3.json'],
  Ladbrokes:['Ladbrokes_1.json','Ladbrokes_2.json','Ladbrokes_3.json'],
  Macauslot:['Macauslot_1.json','Macauslot_2.json','Macauslot_3.json','Macauslot_4.json'],
  WilliamHill:['WilliamHill_1.json','WilliamHill_2.json','WilliamHill_3.json']
};

// <================ 欄位對照表 =================>
const keyMap = {
  initHcap:'ah_open_line',
  initHome:'ah_open_home_odds',
  initAway:'ah_open_away_odds',
  finalHcap:'ah_close_line',
  finalHome:'ah_close_home_odds',
  finalAway:'ah_close_away_odds',
  score:'full_time_score',
  homeTeam:'home_team',
  awayTeam:'away_team',
  dateTime:'match_datetime'
};

// <================ 盤口轉數值 =================>
const hcapMap = {
  '平手':0,'PK':0,
  '平手/半球':-0.25,'受平手/半球':0.25,
  '半球':-0.5,'受半球':0.5,
  '半球/一球':-0.75,'受半球/一球':0.75,
  '一球':-1,'受一球':1,
  '一球/球半':-1.25,'受一球/球半':1.25,
  '球半':-1.5,'受球半':1.5,
  '球半/兩球':-1.75,'受球半/兩球':1.75,
  '兩球':-2,'受兩球':2,
  '兩球/兩球半':-2.25,'受兩球/兩球半':2.25,
  '兩球半':-2.5,'受兩球半':2.5,
  '兩球半/三球':-2.75,'受兩球半/三球':2.75,
  '三球':-3,'受三球':3
};
const cnNum={一:1,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function parseHandicap(str){
  if(!str) return NaN;
  if(hcapMap[str]!==undefined) return hcapMap[str];
  // 「7/7.5」或「受7.5」
  let m=str.match(/^受?([0-9.]+)(?:\/([0-9.]+))?$/);
  if(m){let n=parseFloat(m[1]);return str.startsWith('受')?n:-n;}
  // 「七球」「受七球半」
  m=str.match(/^受?([一二三四五六七八九])球(半)?$/);
  if(m){
    let n=cnNum[m[1]]+(m[2]?0.5:0);
    return str.startsWith('受')?n:-n;
  }
  return NaN;
}

function asianResult(h,a,lineStr){
  const hcap=parseHandicap(lineStr);
  if(isNaN(hcap)) return 'Unknown';
  const diff=h-a+hcap;
  if(diff>0) return 'Win';
  if(diff===0) return 'Draw';
  return 'Lose';
}

// ========== 全局資料 ==========
let fullData=[];
let currentCompany='';
let pieChart=null;

// ========== 初始化公司下拉 ==========
const companySel=document.getElementById('companySel');
Object.keys(fileMap).forEach(c=>{
  const opt=document.createElement('option');
  opt.value=c;opt.textContent=c;
  companySel.appendChild(opt);
});
companySel.addEventListener('change',async()=>{
  currentCompany=companySel.value;
  fullData=await loadCompanyData(currentCompany);
  populateHandicapSelects(fullData);
  clearDisplay();
});

// ========== 讀取公司多檔 JSON ==========
async function loadCompanyData(comp){
  const list=fileMap[comp]||[];
  const arr=await Promise.all(list.map(f=>fetch(f).then(r=>r.json())));
  return arr.flat().map(r=>{
    const [h,a]=r[keyMap.score].split(':').map(Number);
    r.calc_result=asianResult(h,a,r[keyMap.finalHcap]);
    return r;
  });
}

// ========== 填盤口下拉 ==========
const iHcapSel=document.getElementById('iHcapSel');
const fHcapSel=document.getElementById('fHcapSel');
function populateHandicapSelects(data){
  const set=new Set(data.map(r=>r[keyMap.initHcap]).concat(data.map(r=>r[keyMap.finalHcap])));
  const html=['<option value="">全部</option>',...Array.from(set).filter(x=>x).map(x=>`<option>${x}</option>`)].join('');
  iHcapSel.innerHTML=html;
  fHcapSel.innerHTML=html;
}

// ========== 搜尋 ==========
document.getElementById('searchBtn').addEventListener('click',()=>{
  if(!currentCompany){alert('請先選擇公司');return;}
  const rows=applyFilter();
  renderTable(rows);
  renderStats(rows);
});

function num(v,def){v=parseFloat(v);return isNaN(v)?def:v;}
function applyFilter(){
  const ihc=iHcapSel.value, fhc=fHcapSel.value;
  const ihmin=num(document.getElementById('iHomeMin').value,-Infinity);
  const ihmax=num(document.getElementById('iHomeMax').value, Infinity);
  const iamin=num(document.getElementById('iAwayMin').value,-Infinity);
  const iamax=num(document.getElementById('iAwayMax').value, Infinity);
  const fhmin=num(document.getElementById('fHomeMin').value,-Infinity);
  const fhmax=num(document.getElementById('fHomeMax').value, Infinity);
  const famin=num(document.getElementById('fAwayMin').value,-Infinity);
  const famax=num(document.getElementById('fAwayMax').value, Infinity);

  return fullData.filter(r=>{
    const ih=r[keyMap.initHcap], fh=r[keyMap.finalHcap];
    const ihome=+r[keyMap.initHome], iaway=+r[keyMap.initAway];
    const fhome=+r[keyMap.finalHome], faway=+r[keyMap.finalAway];
    return (ihc===''||ihc===ih) &&
           (fhc===''||fhc===fh) &&
           ihome>=ihmin&&ihome<=ihmax &&
           iaway>=iamin&&iaway<=iamax &&
           fhome>=fhmin&&fhome<=fhmax &&
           faway>=famin&&faway<=famax;
  });
}

// ========== 顯示表格 ==========
function renderTable(rows){
  const tbody=document.querySelector('#resTable tbody');
  tbody.innerHTML='';
  rows.forEach(r=>{
    const tr=document.createElement('tr');
    const cols=[
      (r[keyMap.dateTime]||'').split(' ')[0],
      `${r[keyMap.homeTeam]} vs ${r[keyMap.awayTeam]}`,
      r[keyMap.initHcap],r[keyMap.initHome],r[keyMap.initAway],
      r[keyMap.finalHcap],r[keyMap.finalHome],r[keyMap.finalAway],
      r.calc_result
    ];
    cols.forEach(v=>{
      const td=document.createElement('td');td.textContent=v;tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// ========== 統計 & 圖表 ==========
function renderStats(rows){
  const tot=rows.length;
  const win=rows.filter(r=>r.calc_result==='Win').length;
  const draw=rows.filter(r=>r.calc_result==='Draw').length;
  const lose=rows.filter(r=>r.calc_result==='Lose').length;
  const pct=x=>tot?((x/tot*100).toFixed(1)):'0';
  document.getElementById('statWin').textContent=`贏盤 ${win} (${pct(win)}%)`;
  document.getElementById('statDraw').textContent=`走水 ${draw} (${pct(draw)}%)`;
  document.getElementById('statLose').textContent=`輸盤 ${lose} (${pct(lose)}%)`;
  document.getElementById('statTotal').textContent=tot;

  if(pieChart) pieChart.destroy();
  pieChart=new Chart(document.getElementById('pieChart'),{
    type:'pie',
    data:{labels:['Win','Draw','Lose'],
          datasets:[{data:[win,draw,lose]}]},
    options:{responsive:true,legend:{position:'bottom'}}
  });
}

function clearDisplay(){
  document.querySelector('#resTable tbody').innerHTML='';
  renderStats([]);
}

</script>
</body>
</html>
