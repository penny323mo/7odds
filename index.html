<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>足球賠率篩選工具</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 1.5rem; }
    .form-section { margin-bottom: 1rem; }
    #chart-container { width: 200px; margin: 1rem auto; }
    table th, table td { white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4">足球賠率篩選工具</h2>

    <!-- 公司選擇 -->
    <div class="form-group row">
      <label class="col-sm-2 col-form-label">博彩公司：</label>
      <div class="col-sm-4">
        <select id="companySelect" class="form-control"></select>
      </div>
    </div>

    <!-- 初盤 -->
    <div class="form-section border p-3">
      <h5>初盤</h5>
      <div class="form-row">
        <div class="form-group col-md-2">
          <label>盤口</label>
          <select id="initialHandicap" class="form-control"></select>
        </div>
        <div class="form-group col-md-2">
          <label>主隊賠率 (min)</label>
          <input id="initialHomeMin" type="number" step="0.01" class="form-control" placeholder="最小值">
        </div>
        <div class="form-group col-md-2">
          <label>主隊賠率 (max)</label>
          <input id="initialHomeMax" type="number" step="0.01" class="form-control" placeholder="最大值">
        </div>
        <div class="form-group col-md-2">
          <label>客隊賠率 (min)</label>
          <input id="initialAwayMin" type="number" step="0.01" class="form-control" placeholder="最小值">
        </div>
        <div class="form-group col-md-2">
          <label>客隊賠率 (max)</label>
          <input id="initialAwayMax" type="number" step="0.01" class="form-control" placeholder="最大值">
        </div>
      </div>
    </div>

    <!-- 終盤 -->
    <div class="form-section border p-3">
      <h5>終盤</h5>
      <div class="form-row">
        <div class="form-group col-md-2">
          <label>盤口</label>
          <select id="finalHandicap" class="form-control"></select>
        </div>
        <div class="form-group col-md-2">
          <label>主隊賠率 (min)</label>
          <input id="finalHomeMin" type="number" step="0.01" class="form-control" placeholder="最小值">
        </div>
        <div class="form-group col-md-2">
          <label>主隊賠率 (max)</label>
          <input id="finalHomeMax" type="number" step="0.01" class="form-control" placeholder="最大值">
        </div>
        <div class="form-group col-md-2">
          <label>客隊賠率 (min)</label>
          <input id="finalAwayMin" type="number" step="0.01" class="form-control" placeholder="最小值">
        </div>
        <div class="form-group col-md-2">
          <label>客隊賠率 (max)</label>
          <input id="finalAwayMax" type="number" step="0.01" class="form-control" placeholder="最大值">
        </div>
      </div>
    </div>

    <!-- 搜尋按鈕 -->
    <div class="text-center mb-4">
      <button id="searchBtn" class="btn btn-primary">搜尋</button>
    </div>

    <!-- 統計 -->
    <div class="text-center mb-4">
      <span id="statWin">贏盤 0 (0%)</span> /
      <span id="statDraw">和盤 0 (0%)</span> /
      <span id="statLose">輸盤 0 (0%)</span>
    </div>
    <div id="chart-container">
      <canvas id="resultChart"></canvas>
    </div>

    <!-- 結果表格 -->
    <div class="table-responsive">
      <table id="resultTable" class="table table-striped table-sm">
        <thead>
          <tr>
            <th>日期</th>
            <th>比賽</th>
            <th>初盤</th>
            <th>初主賠</th>
            <th>初客賠</th>
            <th>終盤</th>
            <th>終主賠</th>
            <th>終客賠</th>
            <th>結果</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- 依賴 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // ==== 檔案映射（按照你上傳的分割檔名） ====
    const fileMap = {
      Bet365:      ['Bet365_1.json','Bet365_2.json','Bet365_3.json','Bet365_4.json'],
      Crown:       ['Crown_1.json','Crown_2.json','Crown_3.json','Crown_4.json'],
      Interwetten:['Interwetten_1.json','Interwetten_2.json','Interwetten_3.json'],
      JC:          ['JC_1.json','JC_2.json','JC_3.json'],
      Ladbrokes:   ['Ladbrokes_1.json','Ladbrokes_2.json','Ladbrokes_3.json'],
      Macauslot:   ['Macauslot_1.json','Macauslot_2.json','Macauslot_3.json','Macauslot_4.json'],
      WilliamHill: ['WilliamHill_1.json','WilliamHill_2.json','WilliamHill_3.json'],
    };

    // 全局變數
    let currentData = [];

    // 1. 初始化公司下拉
    function initCompanySelect() {
      const sel = document.getElementById('companySelect');
      sel.innerHTML = '<option disabled selected>請選擇</option>';
      Object.keys(fileMap).forEach(c => {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        sel.appendChild(o);
      });
      sel.addEventListener('change', onCompanyChange);
    }

    // 2. 當公司改變，載入並填值
    async function onCompanyChange() {
      const company = this.value;
      currentData = await loadData(company);
      populateHandicapOptions();
    }

    // 3. 載入多檔 JSON 並合併
    async function loadData(company) {
      const urls = fileMap[company] || [];
      try {
        const parts = await Promise.all(
          urls.map(u => fetch(u).then(r => r.ok ? r.json() : Promise.reject(u)))
        );
        return parts.flat();
      } catch(err) {
        console.error('載入失敗', err);
        return [];
      }
    }

    // 4. 填充「初盤」和「終盤」下拉選單
    function populateHandicapOptions() {
      const initSel = document.getElementById('initialHandicap');
      const finalSel = document.getElementById('finalHandicap');
      initSel.innerHTML = '<option value="">全部</option>';
      finalSel.innerHTML = '<option value="">全部</option>';
      const all = currentData.map(r=>r.initial_handicap)
                             .concat(currentData.map(r=>r.final_handicap));
      Array.from(new Set(all)).sort((a,b)=>a-b).forEach(v=>{
        if(v==null||v==='') return;
        const o1 = document.createElement('option');
        o1.value = v; o1.textContent = v;
        initSel.appendChild(o1);
        const o2 = o1.cloneNode(true);
        finalSel.appendChild(o2);
      });
    }

    // 5. 篩選並顯示結果
    function applyFilters() {
      let data = currentData.slice();

      // 依照輸入欄過濾
      const f = {
        initHp:   document.getElementById('initialHandicap').value,
        finalHp:  document.getElementById('finalHandicap').value,
        iHomeMin: +document.getElementById('initialHomeMin').value || -Infinity,
        iHomeMax: +document.getElementById('initialHomeMax').value || Infinity,
        iAwayMin: +document.getElementById('initialAwayMin').value || -Infinity,
        iAwayMax: +document.getElementById('initialAwayMax').value || Infinity,
        fHomeMin: +document.getElementById('finalHomeMin').value || -Infinity,
        fHomeMax: +document.getElementById('finalHomeMax').value || Infinity,
        fAwayMin: +document.getElementById('finalAwayMin').value || -Infinity,
        fAwayMax: +document.getElementById('finalAwayMax').value || Infinity,
      };

      data = data.filter(r=>{
        return (f.initHp==='' || r.initial_handicap==f.initHp)
            && (f.finalHp===''|| r.final_handicap==f.finalHp)
            && r.initial_home_odds  >= f.iHomeMin
            && r.initial_home_odds  <= f.iHomeMax
            && r.initial_away_odds  >= f.iAwayMin
            && r.initial_away_odds  <= f.iAwayMax
            && r.final_home_odds    >= f.fHomeMin
            && r.final_home_odds    <= f.fHomeMax
            && r.final_away_odds    >= f.fAwayMin
            && r.final_away_odds    <= f.fAwayMax;
      });

      renderStats(data);
      renderChart(data);
      renderTable(data);
    }

    // 統計
    function renderStats(data) {
      const total = data.length;
      const win  = data.filter(r=>r.result==='Win').length;
      const draw = data.filter(r=>r.result==='Draw').length;
      const lose = data.filter(r=>r.result==='Lose').length;
      const pct = cnt=> total? (cnt/total*100).toFixed(1):0;
      document.getElementById('statWin').textContent  = `贏盤 ${win} (${pct(win)}%)`;
      document.getElementById('statDraw').textContent = `和盤 ${draw} (${pct(draw)}%)`;
      document.getElementById('statLose').textContent = `輸盤 ${lose} (${pct(lose)}%)`;
    }

    // 圓餅圖
    let chart = null;
    function renderChart(data) {
      const ctx = document.getElementById('resultChart').getContext('2d');
      const counts = {
        Win: data.filter(r=>r.result==='Win').length,
        Draw: data.filter(r=>r.result==='Draw').length,
        Lose: data.filter(r=>r.result==='Lose').length,
      };
      if(chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Win','Draw','Lose'],
          datasets: [{
            data: [counts.Win,counts.Draw,counts.Lose],
            backgroundColor: ['#007bff','#e83e8c','#fd7e14']
          }]
        },
        options: { legend:{position:'bottom'} }
      });
    }

    // 表格
    function renderTable(data) {
      const tb = document.querySelector('#resultTable tbody');
      tb.innerHTML = '';
      data.forEach(r=>{
        const tr = document.createElement('tr');
        ['date','match','initial_handicap','initial_home_odds','initial_away_odds',
         'final_handicap','final_home_odds','final_away_odds','result']
        .forEach(key=>{
          const td = document.createElement('td');
          td.textContent = r[key];
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
    }

    // 啟動
    function init() {
      initCompanySelect();
      document.getElementById('searchBtn')
              .addEventListener('click', ()=>applyFilters());
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>＇
