<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>足球賠率篩選工具</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; }
    header { background:#3366cc; color:#fff; padding:10px; text-align:center; }
    nav { display:flex; background:#fff; border-bottom:1px solid #ccc; }
    nav a { flex:1; padding:10px; text-align:center; text-decoration:none; color:#333; }
    nav a.active { border-bottom:3px solid #3366cc; color:#3366cc; }
    .tab { display:none; padding:10px; }
    .tab.active { display:block; }
    .filter-group { margin-bottom:20px; }
    .filter-group label { display:block; margin:5px 0; }
    .results { margin-top:20px; }
    table { width:100%; border-collapse:collapse; }
    th, td { border:1px solid #ccc; padding:5px; text-align:center; }
  </style>
</head>
<body>
<header>
  <h1>足球賠率篩選工具</h1>
</header>
<nav>
  <a href="#" id="tab-asian-link" class="active">亞洲盤查詢</a>
  <a href="#" id="tab-ou-link">大小球查詢</a>
  <a href="#" id="tab-euro-link">歐洲盤查詢</a>
</nav>

<!-- 版本時間 -->
<div style="text-align:center; padding:8px 0; font-size:0.9em; color:#666;">
  版本時間：2025/07/27 下午09:30:00 (GMT+8)
</div>

<!-- 亞洲盤 Tab -->
<div id="tab-asian" class="tab active">
  <div class="filter-group">
    <label>博彩公司：
      <select id="bookieSelect"></select>
    </label>
  </div>
  <div class="filter-group">
    <label>盤口：<select id="asianHandicap"></select></label>
    <label>主隊賠率：<input id="asianHomeMin" placeholder="最小值"> - <input id="asianHomeMax" placeholder="最大值"></label>
    <label>客隊賠率：<input id="asianAwayMin" placeholder="最小值"> - <input id="asianAwayMax" placeholder="最大值"></label>
  </div>
  <button id="asianSearchBtn">搜尋</button>
  <div class="results">
    <canvas id="asianChart" style="max-width:400px; margin:20px auto;"></canvas>
    <div id="asianStats" style="text-align:center;"></div>
    <table id="asianTable">
      <thead><tr>
        <th>比賽日期</th><th>比賽</th><th>初盤盤口</th><th>初盤主隊賠率</th><th>初盤客隊賠率</th>
        <th>終盤盤口</th><th>終盤主隊賠率</th><th>終盤客隊賠率</th><th>盤口勝負</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 大小球 Tab -->
<div id="tab-ou" class="tab">
  <!-- 類似亞洲盤結構 -->
  <p>大小球功能待實作...</p>
</div>
<!-- 歐洲盤 Tab -->
<div id="tab-euro" class="tab">
  <!-- 類似亞洲盤結構 -->
  <p>歐洲盤功能待實作...</p>
</div>

<script>
// JSON 檔案對應
const fileMap = {
  Bet365: { asian:["Bet365_1.json","Bet365_2.json","Bet365_3.json","Bet365_4.json"] },
  Crown:  { asian:["Crown_1.json","Crown_2.json","Crown_3.json","Crown_4.json"] },
  Interwetten:{ asian:["Interwetten_1.json","Interwetten_2.json","Interwetten_3.json"] },
  JC:     { asian:["JC_1.json","JC_2.json","JC_3.json"] },
  Ladbrokes:{ asian:["Ladbrokes_1.json","Ladbrokes_2.json","Ladbrokes_3.json"] },
  Macauslot:{ asian:["Macauslot_1.json","Macauslot_2.json","Macauslot_3.json","Macauslot_4.json"] },
  WilliamHill:{ asian:["WilliamHill_1.json","WilliamHill_2.json","WilliamHill_3.json"] }
};
let AData = [];

function loadDataForCompany(bk) {
  const files = fileMap[bk].asian;
  return Promise.all(files.map(f => fetch(f).then(r=>r.json()))).then(arr=> {
    AData = arr.flat();
  });
}

function initAsian() {
  const sel = document.getElementById("asianHandicap");
  sel.innerHTML = '<option value="">--</option>';
  const vals = [...new Set(AData.map(d=>d.init_home_handicap))].sort((a,b)=>a-b);
  vals.forEach(v=>{
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

function asianSearch() {
  const handicap = document.getElementById("asianHandicap").value;
  const homeMin = parseFloat(document.getElementById("asianHomeMin").value)||-Infinity;
  const homeMax = parseFloat(document.getElementById("asianHomeMax").value)||Infinity;
  const awayMin = parseFloat(document.getElementById("asianAwayMin").value)||-Infinity;
  const awayMax = parseFloat(document.getElementById("asianAwayMax").value)||Infinity;
  const res = AData.filter(d=>{
    return (handicap===""||d.init_home_handicap==handicap)
      && d.init_home_odds>=homeMin && d.init_home_odds<=homeMax
      && d.init_away_odds>=awayMin && d.init_away_odds<=awayMax;
  });
  // 統計
  const win = res.filter(d=>d.result=="Home").length;
  const draw = res.filter(d=>d.result=="Draw").length;
  const lose = res.filter(d=>d.result=="Away").length;
  const total = res.length;
  document.getElementById("asianStats").innerHTML =
    `贏盤 ${win} (${(win/total*100||0).toFixed(1)}%) `+
    `和盤 ${draw} (${(draw/total*100||0).toFixed(1)}%) `+
    `輸盤 ${lose} (${(lose/total*100||0).toFixed(1)}%) 總 ${total}`;
  // 圖表
  new Chart(document.getElementById("asianChart"),{
    type:"pie",
    data:{labels:["Win","Draw","Lose"], datasets:[{data:[win,draw,lose]}]}
  });
  // 表格
  const tbody = document.querySelector("#asianTable tbody");
  tbody.innerHTML = "";
  res.slice(0,100).forEach(d=>{
    const tr=document.createElement("tr");
    ["match_date","match","init_home_handicap","init_home_odds","init_away_odds",
     "final_home_handicap","final_home_odds","final_away_odds","result"]
    .forEach(key=>{
      const td=document.createElement("td");
      td.textContent=d[key]; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

document.addEventListener("DOMContentLoaded",()=>{
  // 填入博彩公司下拉
  const bookieSel = document.getElementById("bookieSelect");
  Object.keys(fileMap).forEach(bk=>{
    const opt=document.createElement("option");
    opt.value=bk; opt.textContent=bk;
    bookieSel.appendChild(opt);
  });
  // 監聽變更
  bookieSel.addEventListener("change",()=>{
    loadDataForCompany(bookieSel.value).then(()=>{
      initAsian();
      // 清除舊結果
      document.getElementById("asianStats").innerHTML="";
      document.querySelector("#asianTable tbody").innerHTML="";
      document.getElementById("asianChart").getContext("2d").clearRect(0,0,400,400);
    });
  });
  // 點擊搜尋
  document.getElementById("asianSearchBtn").addEventListener("click",asianSearch);
  // 初始載入
  bookieSel.value = Object.keys(fileMap)[0];
  loadDataForCompany(bookieSel.value).then(initAsian);
});
</script>
</body>
</html>
